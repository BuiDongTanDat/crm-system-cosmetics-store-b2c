# CI PIPELINE FOR CRM PROJECT
name: CI Pipeline

on:
  push:
    branches: [public]
  pull_request:
    branches: [public]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create dummy .env files
        run: |
          cat > ./Backend/.env << 'EOF'
          POSTGRES_USER=testuser
          POSTGRES_PASSWORD=testpass
          POSTGRES_DB=testdb
          DATABASE_URL=postgresql://testuser:testpass@db:5432/testdb
          PORT=5000
          NODE_ENV=test
          JWT_SECRET=test-secret-key
          RABBIT_URL=amqp://guest:guest@rabbit:5672
          EOF

          cat > ./Frontend/.env << 'EOF'
          VITE_API_URL=http://localhost:5000
          EOF

          touch ./ai-service/.env

      - name: Build AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: crm-ai-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: crm-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: false
          tags: crm-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./Backend/package-lock.json

      - name: Install Backend dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Create Backend . env for tests
        working-directory: ./Backend
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=testuser
          POSTGRES_PASSWORD=testpass
          POSTGRES_DB=testdb
          DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb
          PORT=5000
          NODE_ENV=test
          JWT_SECRET=test-secret-key
          RABBIT_URL=amqp://guest:guest@localhost:5672
          EOF

      - name: Run Backend Tests
        working-directory: ./Backend
        run: npm test

      - name: Upload Backend Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./Backend/coverage/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔥 TẠO . ENV Ở ROOT
      - name: Create .env files
        run: |
          # 🔥 ROOT .env (docker-compose đọc)
          cat > .env << 'EOF'
          POSTGRES_USER=testuser
          POSTGRES_PASSWORD=testpass
          POSTGRES_DB=testdb
          DATABASE_URL=postgresql://testuser:testpass@db:5432/testdb
          PORT=5000
          NODE_ENV=test
          JWT_SECRET=test-secret-key
          RABBIT_URL=amqp://guest:guest@rabbit:5672
          VITE_API_URL=http://backend:5000
          EOF

          # Backend .env
          cat > ./Backend/.env << 'EOF'
          POSTGRES_USER=testuser
          POSTGRES_PASSWORD=testpass
          POSTGRES_DB=testdb
          DATABASE_URL=postgresql://testuser:testpass@db:5432/testdb
          PORT=5000
          NODE_ENV=test
          JWT_SECRET=test-secret-key
          RABBIT_URL=amqp://guest:guest@rabbit:5672
          EOF

          # Frontend .env
          cat > ./Frontend/.env << 'EOF'
          VITE_API_URL=http://backend:5000
          EOF

          # AI Service .env
          touch ./ai-service/.env

          echo "===================="
          echo "✅ Created .env files"
          echo "===================="
          echo "Root:"
          ls -la .env
          echo ""
          echo "Backend:"
          ls -la ./Backend/.env
          echo ""
          echo "Frontend:"
          ls -la ./Frontend/.env
          echo ""
          echo "AI Service:"
          ls -la ./ai-service/.env

          echo ""
          echo "===================="
          echo "📄 Root .env:"
          echo "===================="
          cat .env

      - name: Start Database and RabbitMQ
        run: |
          echo "🚀 Starting PostgreSQL and RabbitMQ..."
          docker compose up -d db rabbit

      - name: Wait for PostgreSQL
        run: |
          echo "⏳ Waiting for PostgreSQL..."
          for i in {1..40}; do
            if docker compose ps db | grep -q "healthy"; then
              echo "✅ PostgreSQL is healthy!"
              docker compose logs --tail=10 db
              break
            fi
            
            echo "⏳ Attempt $i/40..."
            
            if [ $i -eq 40 ]; then
              echo "❌ Timeout"
              docker compose logs db
              exit 1
            fi
            
            sleep 3
          done

      # 🔥 Test DB connection
      - name: Verify PostgreSQL connection
        run: |
          echo "🔍 Testing PostgreSQL..."
          for i in {1..20}; do
            if docker compose exec -T db psql -U testuser -d testdb -c "SELECT 1;" >/dev/null 2>&1; then
              echo "✅ PostgreSQL ready!"
              break
            fi
            
            echo "⏳ Attempt $i/20..."
            
            if [ $i -eq 20 ]; then
              echo "❌ PostgreSQL not ready"
              exit 1
            fi
            
            sleep 2
          done

      - name: Wait for RabbitMQ
        run: |
          echo "⏳ Waiting for RabbitMQ..."
          for i in {1..30}; do
            if docker compose ps rabbit | grep -q "healthy"; then
              echo "✅ RabbitMQ is healthy!"
              docker compose logs --tail=10 rabbit
              break
            fi
            
            echo "⏳ Attempt $i/30..."
            
            if [ $i -eq 30 ]; then
              echo "❌ Timeout"
              docker compose logs rabbit
              exit 1
            fi
            
            sleep 2
          done

      - name: Start AI Service and Backend
        run: |
          echo "🚀 Starting AI Service..."
          docker compose up -d ai-service

          echo "⏳ Waiting 10s..."
          sleep 10

          echo "🚀 Starting Backend..."
          docker compose up -d backend

          echo "✅ Services started"
          docker compose ps

      - name: Wait for Backend
        run: |
          echo "⏳ Waiting for backend..."

          for i in {1..40}; do
            if docker compose exec -T backend node -e "console.log('OK')" 2>/dev/null; then
              echo "✅ Backend responsive!"
              break
            fi
            
            echo "⏳ Attempt $i/40..."
            
            if [ $i -eq 40 ]; then
              echo "⚠️ Backend issues"
              docker compose logs --tail=100 backend
            fi
            
            sleep 3
          done

          echo "⏳ Waiting for migrations..."
          sleep 15

      - name: Check all services
        run: |
          echo "================================"
          echo "📊 SERVICES STATUS"
          echo "================================"
          docker compose ps

          echo ""
          echo "🐘 PostgreSQL:"
          docker compose logs --tail=30 db

          echo ""
          echo "🐰 RabbitMQ:"
          docker compose logs --tail=20 rabbit

          echo ""
          echo "🤖 AI Service:"
          docker compose logs --tail=30 ai-service

          echo ""
          echo "⚙️ Backend:"
          docker compose logs --tail=100 backend

      - name: Verify database connection
        run: |
          echo "🔍 Testing database..."
          docker compose exec -T db psql -U testuser -d testdb -c "SELECT version();" || {
            echo "❌ Failed"
            exit 1
          }
          echo "✅ OK"

      - name: Run Integration Tests
        run: |
          echo "🧪 Running tests..."
          docker compose exec -T backend npm test || {
            echo "❌ Tests failed!"
            docker compose logs --tail=150 backend
            exit 1
          }
          echo "✅ Tests passed!"

      - name: Cleanup
        if: always()
        run: |
          echo "📊 Final status:"
          docker compose ps

          echo ""
          echo "🧹 Cleaning..."
          docker compose down -v

          echo "✅ Cleanup complete"